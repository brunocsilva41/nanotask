name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Ambiente MSVC (cl/rc no PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ler versão
        id: ver
        shell: pwsh
        run: '"VERSION=$(Get-Content VERSION -Raw)".Trim() >> $env:GITHUB_OUTPUT'

      - name: Configure (CMake + Ninja, MSVC)
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Restore UI (WinUI 3, NuGet)
        shell: pwsh
        run: |
          nuget restore NanoTask.UI/NanoTask.UI.vcxproj 2>$null
          if ($LASTEXITCODE -ne 0) {
            Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
            .\nuget.exe restore NanoTask.UI/NanoTask.UI.vcxproj -PackagesDirectory packages
          }

      - name: Build UI (MSBuild Release x64)
        shell: pwsh
        run: |
          & 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe' `
            NanoTask.UI/NanoTask.UI.vcxproj -p:Configuration=Release -p:Platform=x64 2>$null
          if ($LASTEXITCODE -ne 0) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msb = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
            & $msb NanoTask.UI/NanoTask.UI.vcxproj -p:Configuration=Release -p:Platform=x64
          }

      - name: Smoke test (inicia em modo fantasma e sai)
        shell: pwsh
        run: |
          $p = Start-Process .\build\NanoTask.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(15000)) { Stop-Process $p -Force; throw 'smoke-test travou >15s' }
          if ($p.ExitCode -ne 0) { throw "smoke-test exit=$($p.ExitCode)" }

      - name: Smoke test UI (abre o painel e fecha)
        shell: pwsh
        run: |
          $p = Start-Process .\build\NanoTask.exe -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(25000)) { Stop-Process $p -Force; throw 'smoke-ui travou >25s' }
          if ($p.ExitCode -ne 0) { throw "smoke-ui exit=$($p.ExitCode)" }

      - name: Upload artefato (portable)
        uses: actions/upload-artifact@v4
        with:
          name: NanoTask-portable-${{ steps.ver.outputs.VERSION }}
          path: |
            build/NanoTask.exe
            assets/tray/*.ico
            config/settings.defaults.json
