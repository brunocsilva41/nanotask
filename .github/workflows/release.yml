name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Versão da tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            $f = (Get-Content VERSION -Raw).Trim()
            Write-Warning "Tag '$v' fora do padrao, usando VERSION=$f"
            $v = $f
          }
          "VERSION=$v" >> $env:GITHUB_OUTPUT
          $p = $v.Split('.')
          "MAJOR=$($p[0])" >> $env:GITHUB_OUTPUT
          "MINOR=$($p[1])" >> $env:GITHUB_OUTPUT
          "PATCH=$($p[2])" >> $env:GITHUB_OUTPUT

      - name: Build MinSizeRel (MSVC)
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.VERSION }}'.Split('.')
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DAPP_VERSION_MAJOR=$($v[0]) -DAPP_VERSION_MINOR=$($v[1]) -DAPP_VERSION_PATCH=$($v[2])
          cmake --build build --config MinSizeRel --parallel

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            installer\NanoTask.iss /DAppVersion=${{ steps.ver.outputs.VERSION }}
          mkdir dist-portable -ErrorAction SilentlyContinue | Out-Null
          Copy-Item build\NanoTask.exe dist-portable\
          Copy-Item -Recurse assets\tray dist-portable\assets\
          Copy-Item config\settings.defaults.json dist-portable\
          Compress-Archive -Path dist-portable\* -DestinationPath dist\NanoTask-portable-${{ steps.ver.outputs.VERSION }}.zip -Force

      - name: Notas da release (changelog)
        shell: pwsh
        run: |
          git log --pretty=format:'- %s (%h)' "$(git describe --tags --abbrev=0 HEAD~1)..HEAD" `
            > dist\CHANGELOG.md 2>$null
          if (-not (Test-Path dist\CHANGELOG.md)) { 'Release ${{ steps.ver.outputs.VERSION }}' > dist\CHANGELOG.md }

      - name: SHA-256 dos artefatos
        shell: pwsh
        run: |
          Get-ChildItem dist/NanoTask-Setup-*.exe, dist/NanoTask-portable-*.zip |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Tee-Object dist/SHA256SUMS.txt

      - name: Assinar instalador (SignPath, só com secrets configurados)
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          Write-Host 'Assinatura via SignPath: ver docs/SIGNING.md para o bloco completo.'

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/CHANGELOG.md
          files: |
            dist/NanoTask-Setup-*.exe
            dist/NanoTask-portable-*.zip
            dist/SHA256SUMS.txt
